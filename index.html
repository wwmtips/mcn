<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>오행 인테리어 큐레이션</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Markdown Parser (marked) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    /* 부드러운 페이드인 애니메이션 */
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(4px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-4px); }
    }
    .fade-text {
      animation: fadeInOut 3.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between antialiased">

  <!-- 상단 네비게이션바 -->
  <header class="w-full max-w-md mx-auto p-4 flex items-center justify-between">
    <button type="button" id="prevBtn" class="text-slate-400 hover:text-slate-700 font-bold text-xl hidden cursor-pointer">&larr;</button>
    <div id="stepIndicator" class="text-xs font-semibold text-slate-400 tracking-wider">STEP 1 / 4</div>
    <div class="w-6"></div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="w-full max-w-md mx-auto px-6 flex-1 flex flex-col justify-center pb-12">
    
    <!-- 폼 컨테이너 -->
    <div id="formContainer" class="space-y-6">
      
      <!-- STEP 1: API 키 입력 -->
      <div class="step-content" id="step-1">
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 leading-snug">
          Gemini API 키를<br>입력해주세요
        </h2>
        <p class="text-sm text-slate-500 mt-2">안전한 AI 사주 분석을 위해 브라우저에서만 사용됩니다.</p>
        <div class="mt-6">
          <input 
            type="password" 
            id="apiKey" 
            placeholder="AI Studio API 키 입력" 
            class="w-full px-4 py-4 bg-white border border-slate-200 rounded-2xl text-base focus:outline-none focus:border-blue-500 shadow-sm transition-all"
          />
        </div>
      </div>

      <!-- STEP 2: 생년월일 입력 -->
      <div class="step-content hidden" id="step-2">
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 leading-snug">
          태어난 생년월일을<br>알려주세요
        </h2>
        <p class="text-sm text-slate-500 mt-2">사주 명식을 계산하는 기준이 됩니다.</p>
        <div class="grid grid-cols-3 gap-3 mt-6">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">년도</label>
            <input type="number" id="year" value="1995" min="1900" max="2100" class="w-full px-3 py-4 bg-white border border-slate-200 rounded-2xl text-center font-semibold text-base shadow-sm focus:outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">월</label>
            <input type="number" id="month" value="5" min="1" max="12" class="w-full px-3 py-4 bg-white border border-slate-200 rounded-2xl text-center font-semibold text-base shadow-sm focus:outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">일</label>
            <input type="number" id="day" value="15" min="1" max="31" class="w-full px-3 py-4 bg-white border border-slate-200 rounded-2xl text-center font-semibold text-base shadow-sm focus:outline-none focus:border-blue-500" />
          </div>
        </div>
      </div>

      <!-- STEP 3: 태어난 시간 입력 -->
      <div class="step-content hidden" id="step-3">
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 leading-snug">
          태어난 시간을<br>알려주세요
        </h2>
        <p class="text-sm text-slate-500 mt-2">시주(時柱)를 정확하게 분석하기 위함입니다.</p>
        <div class="grid grid-cols-2 gap-3 mt-6">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">시간 (0~23시)</label>
            <input type="number" id="hour" value="14" min="0" max="23" class="w-full px-3 py-4 bg-white border border-slate-200 rounded-2xl text-center font-semibold text-base shadow-sm focus:outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">분 (0~59분)</label>
            <input type="number" id="minute" value="30" min="0" max="59" class="w-full px-3 py-4 bg-white border border-slate-200 rounded-2xl text-center font-semibold text-base shadow-sm focus:outline-none focus:border-blue-500" />
          </div>
        </div>
      </div>

      <!-- STEP 4: 성별 및 관심사 입력 -->
      <div class="step-content hidden" id="step-4">
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 leading-snug">
          성별과 요즘 가장<br>고민되는 부분을 선택해주세요
        </h2>
        <div class="mt-6 space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">성별</label>
            <select id="gender" class="w-full px-4 py-4 bg-white border border-slate-200 rounded-2xl text-base shadow-sm focus:outline-none focus:border-blue-500">
              <option value="M">남성</option>
              <option value="F">여성</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">주요 관심사</label>
            <input type="text" id="question" value="재물운과 집안 기운 보완" class="w-full px-4 py-4 bg-white border border-slate-200 rounded-2xl text-base shadow-sm focus:outline-none focus:border-blue-500" placeholder="예: 재물운, 직장운, 건강운 등" />
          </div>
        </div>
      </div>

    </div>

    <!-- 로딩 화면 (3.5초 간격 부드러운 전환) -->
    <div id="loadingContainer" class="hidden flex flex-col items-center justify-center py-12 text-center space-y-6">
      <div class="relative w-24 h-24 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-500 animate-spin opacity-75 blur-md"></div>
        <div class="relative w-20 h-20 bg-white rounded-full flex items-center shadow-inner justify-center">
          <span class="text-2xl">🔮</span>
        </div>
      </div>
      <div class="space-y-2 h-16 flex flex-col justify-center">
        <h3 id="loadingText" class="text-lg font-bold text-slate-800 fade-text">사주 명식의 음양오행 균형을 맞추는 중...</h3>
        <p class="text-xs text-slate-400">AI가 사주를 정밀 분석하여 맞춤형 풍수 처방을 도출하고 있습니다.</p>
      </div>
    </div>

    <!-- 결과 화면 (AI가 판단한 내용으로 동적 렌더링) -->
    <div id="resultContainer" class="hidden space-y-6">
      
      <!-- 상단 오행 솔루션 헤더 영역 (AI가 판단한 배치 가이드 노출) -->
      <div class="text-center space-y-2 px-2">
        <span class="text-xs font-bold text-blue-600 tracking-wider bg-blue-50 px-3 py-1 rounded-full">AI 풍수 개운 처방 완료</span>
        <h2 id="prescriptionMainTitle" class="text-xl md:text-2xl font-bold tracking-tight text-slate-900 pt-2 leading-snug">
          AI 분석 중...
        </h2>
      </div>

      <!-- 추천 오행 컬러 카드 (순수 컬러 이름만 노출되도록 프롬프트 및 파싱 최적화) -->
      <div class="bg-white border border-slate-100 rounded-3xl p-5 shadow-sm flex items-center space-x-4">
        <div id="colorBox" class="w-14 h-14 rounded-2xl shadow-inner flex-shrink-0 bg-slate-300 text-white flex items-center justify-center text-xl font-bold">✨</div>
        <div>
          <p id="colorSub" class="text-xs font-semibold text-blue-600">추천 오행 보호 컬러</p>
          <h3 id="colorTitle" class="text-base font-bold text-slate-800">분석 중...</h3>
        </div>
      </div>

      <!-- 상세 가이드 카드 (토스 스타일) -->
      <div class="bg-white border border-slate-100 rounded-3xl p-6 shadow-xl text-sm leading-relaxed text-slate-700 space-y-4">
        <div id="output"></div>
      </div>

      <!-- 하단 액션 버튼들 -->
      <div class="space-y-3 pt-2">
        <button type="button" id="shopBannerBtn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl shadow-lg shadow-blue-500/25 transition-all text-center block cursor-pointer">
          이 소품 구매하기
        </button>
        <button type="button" id="restartBtn" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium rounded-2xl transition-all text-center block cursor-pointer text-sm">
          처음부터 다시 검사하기
        </button>
      </div>
    </div>

    <!-- 다음/제출 버튼 -->
    <div class="mt-8" id="buttonContainer">
      <button 
        type="button" 
        id="nextBtn" 
        class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl shadow-lg shadow-blue-500/25 transition-all text-base cursor-pointer"
      >
        다음
      </button>
    </div>

  </main>

  <script>
    let currentStep = 1;
    const totalSteps = 4;

    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');
    const restartBtn = document.getElementById('restartBtn');
    const stepIndicator = document.getElementById('stepIndicator');
    const formContainer = document.getElementById('formContainer');
    const buttonContainer = document.getElementById('buttonContainer');
    const loadingContainer = document.getElementById('loadingContainer');
    const loadingText = document.getElementById('loadingText');
    const resultContainer = document.getElementById('resultContainer');
    const output = document.getElementById('output');
    const colorBox = document.getElementById('colorBox');
    const colorTitle = document.getElementById('colorTitle');
    const prescriptionMainTitle = document.getElementById('prescriptionMainTitle');

    const loadingMessages = [
      "음양오행 균형을 분석하는 중...",
      "풍수 인테리어 스캔 중...",
      "최적의 소품과 배치 위치 도출 중...",
      "맞춤형 오행 가이드 작성 중..."
    ];

    function updateView() {
      for (let i = 1; i <= totalSteps; i++) {
        const stepEl = document.getElementById(`step-${i}`);
        if (stepEl) {
          if (i === currentStep) {
            stepEl.classList.remove('hidden');
          } else {
            stepEl.classList.add('hidden');
          }
        }
      }

      stepIndicator.innerText = `STEP ${currentStep} / ${totalSteps}`;
      
      if (currentStep > 1) {
        prevBtn.classList.remove('hidden');
      } else {
        prevBtn.classList.add('hidden');
      }

      if (currentStep === totalSteps) {
        nextBtn.innerText = '사주 분석 및 처방 받기';
      } else {
        nextBtn.innerText = '다음';
      }
    }

    prevBtn.addEventListener('click', () => {
      if (currentStep > 1) {
        currentStep--;
        updateView();
      }
    });

    nextBtn.addEventListener('click', async () => {
      if (currentStep === 1) {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
          alert('Gemini API 키를 입력해주세요.');
          return;
        }
      }

      if (currentStep < totalSteps) {
        currentStep++;
        updateView();
      } else {
        await executeAnalysis();
      }
    });

    restartBtn.addEventListener('click', () => {
      resultContainer.classList.add('hidden');
      formContainer.classList.remove('hidden');
      buttonContainer.classList.remove('hidden');
      stepIndicator.classList.remove('hidden');
      currentStep = 1;
      updateView();
    });

    async function executeAnalysis() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const year = parseInt(document.getElementById('year').value);
      const month = parseInt(document.getElementById('month').value);
      const day = parseInt(document.getElementById('day').value);
      const hour = parseInt(document.getElementById('hour').value);
      const minute = parseInt(document.getElementById('minute').value);
      const gender = document.getElementById('gender').value;
      const question = document.getElementById('question').value.trim();

      formContainer.classList.add('hidden');
      buttonContainer.classList.add('hidden');
      prevBtn.classList.add('hidden');
      stepIndicator.classList.add('hidden');
      loadingContainer.classList.remove('hidden');

      let msgIdx = 0;
      loadingText.innerText = loadingMessages[msgIdx];
      const msgInterval = setInterval(() => {
        msgIdx = (msgIdx + 1) % loadingMessages.length;
        loadingText.style.opacity = 0;
        setTimeout(() => {
          loadingText.innerText = loadingMessages[msgIdx];
          loadingText.style.opacity = 1;
        }, 300);
      }, 3500);

      try {
        let sajuData = null;
        try {
          const { calculateSaju } = await import('https://esm.sh/@orrery/core@latest/saju');
          sajuData = calculateSaju({ year, month, day, hour, minute, gender });
        } catch (libErr) {
          console.warn('Orrery 라이브러리 로드 실패', libErr);
        }

        const userPrompt = `
[고객 사주 및 기본 데이터]
- 생년월일시: ${year}년 ${month}월 ${day}일 ${hour}시 ${minute}분 (${gender === 'M' ? '남성' : '여성'})
- 사주 원국 정보: ${sajuData ? JSON.stringify(sajuData.pillars || {}) : '만세력 계산식 참고'}
- 관심사/고민: ${question}

[요청 사항]
고객의 사주를 정밀 분석하여 부족하거나 보완해야 할 오행(목, 화, 토, 금, 수)을 찾고, 이를 해결할 **맞춤형 풍수 소품 및 배치 가이드**, **보호 색상**을 스스로 완전히 판단하여 결정해주세요.

주의사항:
- colorName 값에는 "(화(火)의 기운 보완)" 같은 부가 설명이나 괄호를 절대 넣지 말고, 오직 **순수 컬러 이름**만 적어주세요 (예: "블루", "레드", "그린", "화이트", "옐로우" 등).

반드시 아래 JSON 형식으로만 응답해주세요:
{
  "prescription": "AI가 독창적으로 판단한 풍수 소품과 구체적인 배치 위치 가이드 한 문장 (예: 거실 남쪽 벽면에 붉은색 원석 조각을 걸어두세요.)",
  "colorName": "순수 컬러 이름만 (예: 블루, 레드, 그린, 화이트, 옐로우 중 하나)",
  "colorHex": "해당 컬러의 HEX 코드 (예: #ef4444, #3b82f6, #10b981, #f59e0b, #64748b 중 가장 어울리는 것)",
  "emoji": "어울리는 이모지 심볼 (예: 🔥, 🌊, 🌿, 🪙, 🤍 중 하나)",
  "detailedAnalysis": "사주 원국 진단 및 상세 풍수 인테리어 가이드 (마크다운 포맷)"
}
        `.trim();

        const systemInstruction = `당신은 사주 명리학과 풍수지리 인테리어를 결합하여 삶의 기운을 보완해주는 전문 개운 컨설턴트입니다. 오직 JSON 형식으로만 답변하세요.`;

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
              systemInstruction: { parts: [{ text: systemInstruction }] },
              generationConfig: { 
                temperature: 0.7,
                responseMimeType: "application/json"
              }
            })
          }
        );

        const data = await response.json();
        clearInterval(msgInterval);

        if (data.error) {
          throw new Error(data.error.message || 'Gemini API 통신 실패');
        }

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
        const aiResult = JSON.parse(rawText);

        // 혹시라도 AI가 괄호 내용을 포함해 반환했을 경우를 대비해 괄호 내용 제거 필터링 추가 안전장치
        let cleanColorName = (aiResult.colorName || "블루").replace(/\s*\(.*?\)/g, '').trim();

        prescriptionMainTitle.innerText = aiResult.prescription || "고객 맞춤 개운 처방이 완료되었습니다.";
        colorBox.style.backgroundColor = aiResult.colorHex || "#3b82f6";
        colorBox.innerHTML = aiResult.emoji || "✨";
        colorTitle.innerText = cleanColorName;
        output.innerHTML = marked.parse(aiResult.detailedAnalysis || "상세 분석 내용이 없습니다.");

        loadingContainer.classList.add('hidden');
        resultContainer.classList.remove('hidden');

      } catch (err) {
        clearInterval(msgInterval);
        loadingContainer.classList.add('hidden');
        formContainer.classList.remove('hidden');
        buttonContainer.classList.remove('hidden');
        stepIndicator.classList.remove('hidden');
        alert(`오류가 발생했습니다: ${err.message}`);
      }
    }

    document.getElementById('shopBannerBtn').addEventListener('click', () => {
      alert('쇼핑몰(스마트스토어 등)의 해당 소품 판매 페이지로 이동합니다!');
    });

    updateView();
  </script>
</body>
</html>
